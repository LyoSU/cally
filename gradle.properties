org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# android.defaults.buildfeatures.buildconfig was removed in AGP 9. Modules that
# need BuildConfig now opt in explicitly via buildFeatures { buildConfig = true },
# which :app and :userservice already do.

kotlin.code.style=official
kotlin.incremental=true
ksp.incremental=true
